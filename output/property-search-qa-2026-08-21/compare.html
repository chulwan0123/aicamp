<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>주택 검색 UI 비교</title>
<style>
  body{margin:0;padding:28px;background:#eef0f3;color:#171719;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}
  h1{margin:0 0 20px;font-size:24px}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}.panel{padding:18px;border-radius:20px;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.08)}h2{margin:0 0 14px;font-size:17px}.frame{overflow:hidden;border:1px solid #dedee0;border-radius:14px;background:#fff}.frame img{display:block;width:100%;height:auto}
</style>
<body>
  <h1>시/도 → 시/군/구 → 단지 → 전용면적 비교</h1>
  <main class="compare">
    <section class="panel"><h2>참고 화면</h2><div class="frame"><img src="./reference-area-sheet.jpg" alt="참고 화면"></div></section>
    <section class="panel"><h2>플러스실버 구현</h2><div class="frame"><img src="./area-sheet-390.jpg" alt="구현 화면"></div></section>
  </main>
</body>
</html>
